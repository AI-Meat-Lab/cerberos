name: Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy numpy

      - name: ruff
        run: ruff check cerberos/ tests/

      - name: black --check
        run: black --check cerberos/ tests/

      - name: isort --check
        run: isort --check-only cerberos/ tests/

      - name: mypy
        run: mypy cerberos/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true
