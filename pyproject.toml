[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberos-peptide-splitter"
version = "0.0.1b1"
description = "Approximate homology-aware splitting and diagnostics for peptide FASTA files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Celio Dias Santos-Junior" }]
keywords = [
    "peptides", "fasta", "train-test-split", "minhash", "lsh",
    "out-of-distribution", "ood", "bioinformatics",
    "antimicrobial-peptides",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
full = ["matplotlib>=3.9"]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.2",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "black>=24.0",
    "ruff>=0.6",
    "isort>=5.13",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
"cerberos-peptide-splitter" = "cerberos_peptide_splitter.cli:main"

[project.urls]
Homepage = "https://github.com/AI-Meat-Lab/cerberos"
Documentation = "https://github.com/AI-Meat-Lab/cerberos#readme"
Repository = "https://github.com/AI-Meat-Lab/cerberos"
Issues = "https://github.com/AI-Meat-Lab/cerberos/issues"

[tool.setuptools.packages.find]
include = ["cerberos_peptide_splitter*"]

[tool.setuptools.package-data]
cerberos_peptide_splitter = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "optional: requires an optional dependency",
    "slow: long-running test",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["cerberos_peptide_splitter"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "dist", ".venv", ".tox"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "RUF046",
    "C408",
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["cerberos_peptide_splitter"]
known_third_party = ["numpy", "matplotlib", "pytest", "hypothesis"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
show_error_codes = true
exclude = ["build/", "dist/", "tests/"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
